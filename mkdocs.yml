site_name: robo-appian
site_description: robo-appian by Dinil Mithra is a Python library for business-friendly Appian application automation and testing.
site_url: https://dinilmithra.github.io/robo-appian-docs/
copyright: Copyright &copy; 2026 Dinil Mithra

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/robo-appian-header-logo.png
  favicon: assets/images/robo-appian-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


nav:
  - Home: index.md
  - Features: features.md
  - Get Started:
      - Install: getting-started/installation.md
      - First Workflow: getting-started/quick-start.md
  - Use Features:
      - Components: guides/components.md
      - Verify Results: guides/verification.md
      - Browser Mode: guides/headless-execution.md
      - Evidence: guides/action-snapshots.md
  - Troubleshooting: getting-started/troubleshooting.md
  - License: license.md
